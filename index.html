<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Authentication | user-auth11092026</title>
  <meta name="description" content="Secure and modern user authentication gateway for the 2026 user dashboard platform.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <!-- Background Decorative Glowing Orbs -->
  <div class="bg-glow-top" aria-hidden="true"></div>
  <div class="bg-glow-bottom" aria-hidden="true"></div>

  <main class="auth-wrapper">
    <div class="auth-card">

      <!-- Brand Header -->
      <header class="auth-header">
        <div class="brand-logo">
          <div class="brand-logo-icon">
            <!-- Shield Lock SVG Icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <circle cx="12" cy="11" r="2"/>
              <path d="M12 13v3"/>
            </svg>
          </div>
          <div class="brand-logo-text">Auth<span>Portal</span></div>
        </div>

        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to access your dashboard</p>
      </header>

      <!-- Dynamic Alert Box for Errors and Feedback -->
      <div id="authAlert" class="auth-alert" role="alert" aria-live="assertive">
        <svg class="auth-alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="authAlertText"></span>
      </div>

      <!-- Authentication Form -->
      <form id="loginForm" class="auth-form" novalidate autocomplete="off">
        
        <!-- Username Field -->
        <div class="form-group">
          <label for="usernameInput" class="form-label">Username</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input 
              type="text" 
              id="usernameInput" 
              class="form-input" 
              placeholder="Enter your username" 
              required 
              autofocus
              aria-required="true"
            >
          </div>
        </div>

        <!-- Password Field with Show/Hide Toggle -->
        <div class="form-group">
          <label for="passwordInput" class="form-label">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input 
              type="password" 
              id="passwordInput" 
              class="form-input" 
              placeholder="Enter your password" 
              required 
              aria-required="true"
            >
            <button 
              type="button" 
              id="togglePasswordBtn" 
              class="password-toggle" 
              aria-label="Show password" 
              tabindex="0"
            >
              <!-- Eye Icon (Show) -->
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <!-- Eye Off Icon (Hide) -->
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="loginBtn" class="btn btn-primary btn-full">
          <span class="spinner" aria-hidden="true"></span>
          <span class="btn-text">Sign In</span>
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>

      </form>

      <!-- Demo Credentials Reference -->
      <footer class="demo-hint-box" aria-label="Demo login details">
        <div class="demo-hint-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="16" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
          Demo Credentials
        </div>
        <div class="demo-hint-list">
          <div class="demo-hint-item">User: <code>admin</code></div>
          <div class="demo-hint-item">Pass: <code>Abc@2026</code></div>
        </div>
      </footer>

    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
